# Nginx for Smart City frontend.
# Serves the Vite-built SPA and reverse-proxies /api/* to the backend service.

worker_processes auto;
events { worker_connections 1024; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  sendfile          on;
  tcp_nopush        on;
  keepalive_timeout 65;
  server_tokens     off;

  gzip on;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

  # Docker / K8s embedded DNS
  resolver 127.0.0.11 valid=30s ipv6=off;

  # Upstream backend — resolves to the smart-city-backend service.
  upstream backend {
    server smart-city-backend:5000;
  }

  server {
    listen      80 default_server;
    listen      [::]:80 default_server;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # Static assets — long cache for hashed Vite output
    location ~* \.(?:js|css|woff2?|ttf|svg|png|jpg|jpeg|gif|webp|ico)$ {
      expires 1y;
      add_header Cache-Control "public, immutable";
      try_files $uri =404;
    }

    # API proxy — Authorization header passes through automatically
    location /api/ {
      proxy_pass         http://backend/api/;
      proxy_http_version 1.1;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
      proxy_read_timeout 60s;
      client_max_body_size 5m;
    }

    # SPA fallback — React Router
    location / {
      try_files $uri $uri/ /index.html;
    }
  }
}
