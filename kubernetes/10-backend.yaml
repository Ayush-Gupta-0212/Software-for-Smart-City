# Backend: Deployment + Service
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: smart-city-backend
  namespace: smart-city
  labels:
    app: smart-city-backend
    tier: backend
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: smart-city-backend
  template:
    metadata:
      labels:
        app: smart-city-backend
        tier: backend
      annotations:
        # Prometheus scrape annotations — for default annotation-based discovery
        prometheus.io/scrape: "true"
        prometheus.io/port: "5000"
        prometheus.io/path: "/"
    spec:
      containers:
        - name: backend
          image: smart-city/backend:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 5000
          envFrom:
            - configMapRef:
                name: smart-city-config
            - secretRef:
                name: smart-city-secrets   # created via kubectl from backend/.env
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet: { path: /, port: http }
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet: { path: /, port: http }
            initialDelaySeconds: 8
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: smart-city-backend
  namespace: smart-city
  labels:
    app: smart-city-backend
spec:
  type: ClusterIP
  selector:
    app: smart-city-backend
  ports:
    - name: http
      port: 5000
      targetPort: http
