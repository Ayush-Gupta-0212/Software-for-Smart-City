services:
  # Backend Service
  - type: web
    name: smart-city-backend
    env: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
      - key: OPENROUTER_API_KEY
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: WEATHERSTACK_API_KEY
        sync: false

  # Frontend Static Site
  - type: static
    name: smart-city-frontend
    env: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: smart-city-backend
          property: url
          envVarKey: VITE_API_URL # Optional: Map if needed by Render's internal logic, but usually accessing via service discovery var is different.
          # Actually, for static sites, we need to set this at build time.
          # Render allows linking services.
          # Better approach for static site needing backend URL:
          # We can uses 'fromService' to automatically get the URL of the backend service.
          # However, VITE_API_URL must be available during build time.
